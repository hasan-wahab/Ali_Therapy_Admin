name: ali_therapy_admin
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
   sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5
  go_router: ^14.6.0
  flutter_screenutil: ^5.9.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  dropdown_button2: ^3.1.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.6
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Generates Android + iOS launcher icons from our logo.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/dr_ali_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/dr_ali_icon.png

# Native launch splash (Figma 651:2):
#   white screen + centered 176pt clinic logo + Neon Web branding at bottom.
# Phone + tablet: same design, tablet uses a larger layout (see AppNativeSplashView
# and drawable-sw600dp after generate).
# After changing images, run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/images/native_splash_logo.png
  image_dark: assets/images/native_splash_logo.png
  branding: assets/images/native_splash_branding.png
  branding_dark: assets/images/native_splash_branding.png
  branding_mode: bottom
  branding_bottom_padding: 32
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/native_splash_android12.png
    image_dark: assets/images/native_splash_android12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"
    branding: assets/images/native_splash_android12_branding.png
    branding_dark: assets/images/native_splash_android12_branding.png


flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/images/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
